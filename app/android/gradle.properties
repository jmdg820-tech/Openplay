org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Release builds on this machine fail during :package_info_plus:compileReleaseKotlin,
# :url_launcher_android:compileReleaseKotlin, and :shared_preferences_android:compileReleaseKotlin
# with "this and base files have different roots". Root cause: this project
# lives on H:\ while the Dart/Flutter pub cache (source of these plugins'
# Kotlin sources) lives on C:\ -- Kotlin's incremental compiler (Build Tools
# API, RelocatableFileToPathConverter) tries to store cache entries as paths
# relative to the project root so the cache is portable/relocatable, which is
# mathematically impossible across two different Windows drive letters.
# Disabling Kotlin incremental compilation avoids that relocatable-path
# computation entirely; every build recompiles Kotlin sources fully instead
# of reusing a cache (slower rebuilds only -- no change to the compiled
# output, runtime behavior, or security posture). Scoped narrowly to this
# one flag rather than disabling Gradle's own build cache or AGP features.
kotlin.incremental=false
